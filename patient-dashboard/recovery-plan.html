<style>
/* Layout: one phone-width column read top to bottom. Status first, then what is missing, what is ready to leave, questions, help. */
:root {
  --bg: #F2F5F1;
  --surface: #FFFFFF;
  --ink: #13231E;
  --muted: #4E5F58;
  --line: #D3DCD5;
  --accent: #0B6B58;
  --accent-ink: #FFFFFF;
  --accent-soft: #DFEEE8;
  --wait-bg: #E8ECE9; --wait-fg: #3B4843;
  --work-bg: #FBEED3; --work-fg: #864C00;
  --good-bg: #DCF0E2; --good-fg: #17663A;
  --bad-bg: #F7DFDB;  --bad-fg: #992E24;
  --font: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --fs-small: 0.9375rem;
  --fs-body: 1.125rem;
  --fs-h2: 1.375rem;
  --fs-hero: clamp(1.625rem, 6vw, 2.125rem);
  --radius: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1613; --surface: #16211D; --ink: #E5EEE9; --muted: #9DAEA7; --line: #2C3934;
    --accent: #52C3A9; --accent-ink: #0B1C17; --accent-soft: #173A31;
    --wait-bg: #24302B; --wait-fg: #C3D0CA;
    --work-bg: #3A2A0E; --work-fg: #F3BC5E;
    --good-bg: #143021; --good-fg: #86D7A0;
    --bad-bg: #3C1B17;  --bad-fg: #F3A196;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1613; --surface: #16211D; --ink: #E5EEE9; --muted: #9DAEA7; --line: #2C3934;
  --accent: #52C3A9; --accent-ink: #0B1C17; --accent-soft: #173A31;
  --wait-bg: #24302B; --wait-fg: #C3D0CA;
  --work-bg: #3A2A0E; --work-fg: #F3BC5E;
  --good-bg: #143021; --good-fg: #86D7A0;
  --bad-bg: #3C1B17;  --bad-fg: #F3A196;
  color-scheme: dark;
}

body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: var(--fs-body); line-height: 1.5; }
.wrap {
  max-width: 36rem; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
  display: flex; flex-direction: column; gap: 32px;
}
svg.i { width: 24px; height: 24px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Top bar */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; margin: 0; font-weight: 700; }
.brand svg { color: var(--accent); }
.controls { display: flex; flex-wrap: wrap; gap: 8px; }
.seg { display: inline-flex; padding: 3px; border: 2px solid var(--line); border-radius: 12px; background: var(--surface); }
.seg button {
  font: inherit; font-size: var(--fs-small); font-weight: 700; min-height: 44px; padding: 0 14px;
  border: 0; border-radius: 9px; background: transparent; color: var(--muted); cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.btn {
  font: inherit; font-size: var(--fs-small); font-weight: 700; min-height: 54px; padding: 0 16px;
  display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
  border: 2px solid var(--accent); border-radius: 12px; background: var(--surface); color: var(--accent);
}
.btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.btn svg.i { width: 22px; height: 22px; }

/* Notice line */
.notice { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: -16px; }

/* Chips: state is carried by color and by the label */
.chip {
  display: inline-flex; align-items: center; gap: 7px; padding: 4px 12px; border-radius: 999px;
  font-size: var(--fs-small); font-weight: 700; line-height: 1.35;
}
.chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; }
.tone-wait { background: var(--wait-bg); color: var(--wait-fg); }
.tone-work { background: var(--work-bg); color: var(--work-fg); }
.tone-good { background: var(--good-bg); color: var(--good-fg); }
.tone-bad  { background: var(--bad-bg);  color: var(--bad-fg); }
.tone-you  { background: var(--accent); color: var(--accent-ink); }

/* Status card */
.hero {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 22px 20px; display: flex; flex-direction: column; gap: 20px;
}
.hero-head { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }
.hero h1 { margin: 0; font-size: var(--fs-hero); line-height: 1.2; text-wrap: balance; }
.lead { margin: 0; max-width: 60ch; }

.track { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); }
.step { position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; font-size: var(--fs-small); color: var(--muted); padding: 0 4px; }
.step::before { content: ""; position: absolute; top: 13px; right: 50%; width: 100%; height: 3px; background: var(--line); }
.step:first-child::before { display: none; }
.step.done::before, .step.current::before, .step.bad::before, .step.stopped::before { background: var(--accent); }
.dot {
  position: relative; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
  border: 3px solid var(--line); background: var(--surface); color: var(--accent-ink);
}
.dot svg.i { width: 16px; height: 16px; stroke-width: 3; }
.step.done .dot { background: var(--accent); border-color: var(--accent); }
.step.current .dot { border-color: var(--accent); }
.step.current .dot::after { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); }
.step.bad .dot { background: var(--bad-fg); border-color: var(--bad-fg); color: var(--surface); }
.step.stopped .dot { background: var(--wait-fg); border-color: var(--wait-fg); }
.step.current, .step.bad, .step.done:last-child { color: var(--ink); font-weight: 700; }

.programs { display: flex; flex-direction: column; gap: 16px; padding-top: 18px; border-top: 1px solid var(--line); }
.program { display: flex; gap: 14px; align-items: flex-start; }
.tile { flex: none; width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.program-body { min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
.program-name { font-weight: 700; }
.program-what { color: var(--muted); }

.facts { margin: 0; padding-top: 18px; border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(auto-fit, minmax(9.5rem, 1fr)); gap: 14px; }
.fact { min-width: 0; }
.fact dt { font-size: var(--fs-small); color: var(--muted); }
.fact dd { margin: 0; font-weight: 700; font-variant-numeric: tabular-nums; }

#main { display: flex; flex-direction: column; gap: 32px; }

/* Sections */
section { display: flex; flex-direction: column; gap: 12px; }
h2 { display: flex; align-items: center; gap: 10px; margin: 0; font-size: var(--fs-h2); line-height: 1.25; text-wrap: balance; }
h2 svg.i { color: var(--accent); width: 26px; height: 26px; }
.sub { margin: 0; color: var(--muted); max-width: 60ch; }

.rows { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 14px; padding: 16px 18px; }
.row + .row { border-top: 1px solid var(--line); }
.row-main { min-width: 0; flex: 1 1 13rem; display: flex; flex-direction: column; gap: 2px; }
.row-title { font-weight: 700; }
.row-meta { font-size: var(--fs-small); color: var(--muted); }
.row-value { font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.empty { padding: 16px 18px; margin: 0; color: var(--muted); }

.questions { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.q { align-self: flex-start; max-width: 60ch; padding: 14px 18px; border-radius: 18px 18px 18px 4px; background: var(--accent-soft); font-weight: 700; }

.help { display: flex; gap: 14px; align-items: flex-start; padding: 18px; border-radius: var(--radius); background: var(--wait-bg); }
.help .tile { background: var(--surface); }
.help p { margin: 0; }
.help-text { display: flex; flex-direction: column; gap: 4px; min-width: 0; }

/* Staff footer */
.staff { border-top: 1px solid var(--line); padding-top: 20px; display: flex; flex-direction: column; gap: 12px; font-size: var(--fs-small); color: var(--muted); }
.staff h2 { font-size: var(--fs-body); color: var(--ink); }
.staff p { margin: 0; }
.staff-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn-quiet { min-height: 48px; border-color: var(--line); color: var(--ink); }
input[type="file"]:focus-visible + label { outline: 3px solid var(--accent); outline-offset: 2px; }
#fileMsg:empty { display: none; }
#fileMsg { color: var(--bad-fg); font-weight: 700; }
code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 0.9em; overflow-wrap: anywhere; }
</style>

    var t = T[lang];
    if (summaryInLang() && (summary().your_options || []).length) {
      return summary().your_options.map(function (o) { return { name: o.provider_name, what: o.what_it_is, status: o.status, tone: toneOf(o.status) }; });
    }
    return providers().map(function (p) {
      return { name: p.name || p.provider_id, what: t.recup, status: t.prov[p.status], tone: PROV_TONE[p.status] || "wait" };
    });
  }
  function whereText(status, n) {
    var s = summary();
    if (summaryInLang() && s.where_things_stand) return s.where_things_stand;
    return T[lang].where(status, n);
  }
  function questions() {
    var t = T[lang];
    if (summaryInLang() && (summary().questions_to_ask_your_team || []).length) return summary().questions_to_ask_your_team;
    var q = [], p = mainProvider();
    (sst.gaps || []).filter(function (g) { return g.status === "requested"; }).forEach(function (g) { q.push(t.qSent(g.what)); });
    if (p && ["sent", "reviewing", "information_requested"].indexOf(p.status) !== -1) q.push(t.qWhen);
    if (!val("referral.anticipated_discharge_date")) q.push(t.qLeave);
    if (val("arrangements.pcp_followup_scheduled") === true) q.push(t.qDoctor);
    return q;
  }
  function boolState(v, yes) {
    var s = T[lang].s;
    if (v === true) return { status: yes, tone: "good" };
    if (v === false) return { status: s.notYet, tone: "wait" };
    return { status: s.unconfirmed, tone: "wait" };
  }
  function readyRows() {
    var t = T[lang], rows = [];
    var auth = val("referral.authorization_status");
    rows.push({ label: t.r.auth, status: t.auth[auth] || t.s.unconfirmed, tone: { approved: "good", requested: "work", denied: "bad" }[auth] || "wait" });
    rows.push(Object.assign({ label: t.r.pcp }, boolState(val("arrangements.pcp_followup_scheduled"), t.s.booked)));
    rows.push(Object.assign({ label: t.r.meds }, boolState(val("medications.thirty_day_supply_arranged"), t.s.ready)));

    var dme = val("function.mobility.dme_type");
    if (Array.isArray(dme) && dme.length) {
      rows.push({ label: t.r.dme, value: dme.map(function (d) { return t.dme[String(d).toLowerCase()] || d; }).join(", ").replace(/^./, function (c) { return c.toUpperCase(); }) });
    }
    // Only shown when the record says something about them.
    [["arrangements.pt_scheduled", "pt", "booked"], ["arrangements.wound_care_scheduled", "wound", "booked"],
     ["arrangements.oxygen_ordered_tank_ready_day_before", "o2", "ready"], ["arrangements.dialysis_schedule_confirmed", "dialysis", "confirmed"],
     ["arrangements.hospice_arranged", "hospice", "ready"]].forEach(function (x) {
      var v = val(x[0]);
      if (v !== null && v !== undefined) rows.push(Object.assign({ label: t.r[x[1]] }, boolState(v, t.s[x[2]])));
    });
    var hh = val("arrangements.home_health_status");
    if (hh && hh !== "none") rows.push({ label: t.r.hh, status: t.hh[hh] || hh, tone: hh === "coordinated_and_scheduled" ? "good" : "work" });
    var sp = val("arrangements.specialty_followups");
    if (Array.isArray(sp)) sp.forEach(function (x) {
      var name = typeof x === "string" ? x : (x && (x.what || x.name || x.specialty)) || "";
      if (name) rows.push({ label: t.r.visit + ": " + name, status: t.s.booked, tone: "good" });
    });
    return rows;
  }

  /* ---------- drawing ---------- */
  function icon(id, cls) { return '<svg class="i' + (cls ? " " + cls : "") + '" aria-hidden="true"><use href="#' + id + '"/></svg>'; }
  function chip(text, tone) { return text ? '<span class="chip tone-' + (tone || "wait") + '">' + esc(text) + "</span>" : ""; }

  function trackStates(status) {
    switch (status) {
      case "sent": case "reviewing": case "information_requested": return ["done", "current", "todo"];
      case "approved": return ["done", "done", "done"];
      case "denied": return ["done", "done", "bad"];
      case "withdrawn": return ["done", "done", "stopped"];
      default: return ["current", "todo", "todo"];
    }
  }

  function render() {
    var t = T[lang];
    document.documentElement.lang = lang;
    document.title = t.app;
    document.getElementById("appName").textContent = t.app;
    document.getElementById("langGroup").setAttribute("aria-label", t.langGroup);
    ["es", "en"].forEach(function (l) { document.getElementById("lang-" + l).setAttribute("aria-pressed", String(l === lang)); });
    stopSpeaking();

    var p = mainProvider();
    var status = p ? p.status : null;
    var needed = neededItems();
    var html = "";

    // Notice line
    var s = summary(), notes = "";
    if (at(sst, "meta.fictional")) notes += chip(t.example, "wait");
    if (s.reviewed_by) notes += chip(t.reviewed(s.reviewed_by), "good");
    else if (s.requires_staff_review !== false) notes += chip(t.draft, "work");
    if (notes) html += '<div class="notice">' + notes + "</div>";

    // Status card
    var states = trackStates(status);
    var labels = t.steps.slice();
    if (states[2] === "done") labels[2] = t.stepApproved;
    if (states[2] === "bad") labels[2] = t.stepDenied;
    if (states[2] === "stopped") labels[2] = t.stepStopped;
    var track = states.map(function (st, i) {
      var mark = st === "done" ? icon("i-check") : st === "bad" ? icon("i-x") : "";
      return '<li class="step ' + st + '"><span class="dot">' + mark + "</span><span>" + esc(labels[i]) +
        '<span class="vh"> (' + esc(t.stateWords[st]) + ")</span></span></li>";
    }).join("");

    var opts = options();
    var progs = opts.length ? opts.map(function (o) {
      return '<div class="program" data-say><span class="tile">' + icon("i-bed") + '</span><div class="program-body">' +
        '<span class="program-name">' + esc(o.name) + "</span>" +
        (o.what ? '<span class="program-what">' + esc(o.what) + "</span>" : "") + chip(o.status, o.tone) + "</div></div>";
    }).join("") : '<p class="program-what" data-say>' + esc(t.noProgram) + "</p>";

    var leave = val("referral.anticipated_discharge_date");
    var stay = val("referral.length_of_stay_authorized_days");
    var updated = fmtDate(at(sst, "meta.updated_at"));
    var facts = '<div class="fact" data-say><dt>' + esc(t.leave) + "</dt><dd>" + esc(leave || t.leaveUnknown) + "</dd></div>";
    if (stay) facts += '<div class="fact" data-say><dt>' + esc(t.stay) + "</dt><dd>" + esc(t.days(stay)) + "</dd></div>";
    if (updated) facts += '<div class="fact"><dt>' + esc(t.updated) + "</dt><dd>" + esc(updated) + "</dd></div>";

    html += '<article class="hero" aria-labelledby="statusHead">' +
      '<div class="hero-head">' + (status ? chip(t.prov[status], PROV_TONE[status]) : "") +
      '<h1 id="statusHead" data-say>' + esc(t.head[status] || t.head.none) + "</h1></div>" +
      '<ol class="track" aria-label="' + esc(t.progress) + '">' + track + "</ol>" +
      '<p class="lead" data-say>' + esc(whereText(status, needed.length)) + "</p>" +
      '<div class="programs">' + progs + "</div>" +
      '<dl class="facts">' + facts + "</dl></article>";

    // What's still missing
    var needRows = needed.length ? '<ul class="rows">' + needed.map(function (n) {
      return '<li class="row" data-say><div class="row-main"><span class="row-title">' + esc(n.what) + "</span>" +
        (n.who ? '<span class="row-meta">' + esc(t.gets) + ": " + esc(n.who) + "</span>" : "") + "</div>" +
        '<span class="chips">' + (n.you ? chip(t.forYou, "you") : "") + chip(n.status, n.tone) + "</span></li>";
    }).join("") + "</ul>" : '<div class="rows"><p class="empty" data-say>' + esc(t.needNone) + "</p></div>";
    var needSub = !needed.length ? "" : needed.some(function (n) { return n.you; }) ? t.needYou : t.needNotYou;
    html += '<section aria-labelledby="needHead"><h2 id="needHead" data-say>' + icon("i-clip") + esc(t.needTitle) + "</h2>" +
      (needSub ? '<p class="sub" data-say>' + esc(needSub) + "</p>" : "") + needRows + "</section>";

    // Before you leave
    html += '<section aria-labelledby="readyHead"><h2 id="readyHead" data-say>' + icon("i-exit") + esc(t.readyTitle) + '</h2><ul class="rows">' +
      readyRows().map(function (r) {
        return '<li class="row" data-say><div class="row-main"><span class="row-title">' + esc(r.label) + "</span></div>" +
          (r.value ? '<span class="row-value">' + esc(r.value) + "</span>" : chip(r.status, r.tone)) + "</li>";
      }).join("") + "</ul></section>";

    // Questions
    var qs = questions();
    if (qs.length) {
      html += '<section aria-labelledby="qHead"><h2 id="qHead" data-say>' + icon("i-talk") + esc(t.qTitle) + "</h2>" +
        '<p class="sub" data-say>' + esc(t.qHint) + '</p><ul class="questions">' +
        qs.map(function (q) { return '<li class="q" data-say>' + esc(q) + "</li>"; }).join("") + "</ul></section>";
    }

    // Help
    html += '<aside class="help"><span class="tile">' + icon("i-phone") + '</span><div class="help-text">' +
      '<p data-say><strong>' + esc(t.helpWorse) + "</strong></p><p data-say>" + esc(t.helpEmergency) + "</p></div></aside>";

    document.getElementById("main").innerHTML = html;
    renderStaff();
  }

  function renderStaff() {
    var t = T[lang];
    var ref = at(sst, "meta.referral_id");
    var ver = at(sst, "meta.sst_version");
    document.getElementById("staff").innerHTML =
      "<h2>" + esc(t.staff) + "</h2><p>" + esc(t.staffNote) + "</p>" +
      "<p>" + esc(t.showing) + ": " + (loadedName ? "<code>" + esc(loadedName) + "</code>" : esc(t.exampleFile)) +
      (ref ? " · " + esc(t.ref) + " <code>" + esc(ref) + "</code>" : "") + (ver ? " · SST " + esc(ver) : "") + "</p>" +
      '<div class="staff-actions">' +
      '<input type="file" id="file" accept=".json,application/json" class="vh">' +
      '<label for="file" class="btn btn-quiet">' + icon("i-file") + esc(t.open) + "</label>" +
      (loadedName ? '<button type="button" class="btn btn-quiet" id="backBtn">' + esc(t.back) + "</button>" : "") +
      '</div><p id="fileMsg" role="status"></p>';

    document.getElementById("file").addEventListener("change", onFile);
    var back = document.getElementById("backBtn");
    if (back) back.addEventListener("click", function () { sst = EXAMPLE; loadedName = null; if (!userPickedLang) lang = recordLang(); render(); });
  }

  function onFile(e) {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var d = JSON.parse(reader.result);
        if (!d || typeof d !== "object" || !d.meta || !("patient_summary" in d)) throw new Error("not an SST record");
        sst = d; loadedName = f.name;
        if (!userPickedLang) lang = recordLang();
        render();
      } catch (err) {
        document.getElementById("fileMsg").textContent = T[lang].badFile;
      }
    };
    reader.readAsText(f);
  }

  /* ---------- language ---------- */
  function recordLang() {
    var l = String(summary().language || "").toLowerCase().slice(0, 2);
    if (l === "es" || l === "en") return l;
    var pref = String(val("patient.preferred_language") || "");
    if (/span|espa/i.test(pref)) return "es";
    return "en";
  }
  function savedLang() { try { return localStorage.getItem("sst-patient-lang"); } catch (e) { return null; } }
  document.getElementById("langGroup").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-lang]");
    if (!b || b.dataset.lang === lang) return;
    lang = b.dataset.lang; userPickedLang = true;
    try { localStorage.setItem("sst-patient-lang", lang); } catch (err) {}
    render();
  });

  /* ---------- read aloud ---------- */
  var listenBtn = document.getElementById("listen");
  var canSpeak = "speechSynthesis" in window && typeof window.SpeechSynthesisUtterance === "function";
  var speaking = false;
  function setListen(on) {
    speaking = on;
    var t = T[lang];
    listenBtn.setAttribute("aria-pressed", String(on));
    listenBtn.innerHTML = icon(on ? "i-stop" : "i-sound") + "<span>" + esc(on ? t.stop : t.listen) + "</span>";
  }
  function stopSpeaking() {
    if (canSpeak) { try { window.speechSynthesis.cancel(); } catch (e) {} }
    if (canSpeak) setListen(false);
  }
  if (canSpeak) {
    listenBtn.hidden = false;
    listenBtn.addEventListener("click", function () {
      if (speaking) { stopSpeaking(); return; }
      var parts = Array.prototype.map.call(document.querySelectorAll("#main [data-say]"), function (el) {
        return el.innerText.replace(/\s+/g, " ").trim();
      }).filter(Boolean);
      if (!parts.length) return;
      setListen(true);
      parts.forEach(function (text, i) {
        var u = new SpeechSynthesisUtterance(text);
        u.lang = lang === "es" ? "es-US" : "en-US";
        u.rate = 0.92;
        if (i === parts.length - 1) { u.onend = function () { setListen(false); }; }
        u.onerror = function () { setListen(false); };
        window.speechSynthesis.speak(u);
      });
    });
  }

  var saved = savedLang();
  if (saved === "es" || saved === "en") { lang = saved; userPickedLang = true; } else { lang = recordLang(); }
  render();
})();
</script>
